# CMSページが読み込む assets/ucar-cards.js は jsDelivr のCDN経由なので、
# GitHubを更新しても最大12時間ほど古いままになることがあります。
# assets/ を更新したら自動でCDNのキャッシュを消し、すぐ反映されるようにします。
# 手動で消したいときは Actions タブ →「CDNキャッシュを更新」→「Run workflow」。
name: CDNキャッシュを更新

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jsDelivrのキャッシュを削除
        run: |
          set -u
          for name in ucar-cards.js ucar-cards.core.js; do
            path="/gh/${GITHUB_REPOSITORY}@main/assets/${name}"
            echo "--- purge ${path}"
            code=$(curl -sS -o /tmp/purge.json -w '%{http_code}' "https://purge.jsdelivr.net${path}" || echo 000)
            cat /tmp/purge.json 2>/dev/null || true
            echo
            if [ "$code" != "200" ]; then
              echo "::error::jsDelivrのキャッシュ削除に失敗しました (HTTP ${code}) ${name}"
              exit 1
            fi
          done

      - name: 反映されたか確認
        run: |
          expected=$(grep -o 'FukuokaToyopetUcarVersion = "[^"]*"' assets/ucar-cards.core.js | head -1)
          # ブラウザ側が何時間キャッシュするかも記録しておく
          curl -sSI "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/assets/ucar-cards.core.js" \
            | grep -iE '^(cache-control|age|x-jsd-version)' || true
          for i in 1 2 3 4 5 6; do
            served=$(curl -sS "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/assets/ucar-cards.core.js" \
              | grep -o 'FukuokaToyopetUcarVersion = "[^"]*"' | head -1)
            echo "CDN: ${served:-なし} / リポジトリ: ${expected}"
            if [ -n "$served" ] && [ "$served" = "$expected" ]; then
              echo "CDNは最新です"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::CDNがまだ古い可能性があります。数分後にもう一度実行してください"
