# Gazooの価格・車両情報・売約状況・メイン画像を自動でチェックする仕組み
# 管理画面で設定した時刻（既定は 朝6時と夜20時・日本時間）を過ぎたら更新します。
# GitHubの定期実行は最大数時間ずれるため、「予定時刻ちょうど」ではなく
# 「予定時刻を過ぎてまだ実行していないか」で判定します（遅れても取りこぼしません）。
# GitHubの Actions タブ → 「Gazoo自動更新」 → 「Run workflow」で時刻に関係なく実行できます。
name: Gazoo自動更新

on:
  schedule:
    - cron: "0 * * * *"   # 毎時。実際に動かす時刻は data/settings.json で決める
  workflow_dispatch:       # 手動実行ボタン

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 表示設定のずれと解析処理を確認
        run: |
          node scripts/check-consistency.mjs
          node scripts/test-parser.mjs

      - name: Gazooをチェックしてデータと画像を更新
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/update-from-gazoo.mjs

      - name: 変更があれば保存
        run: |
          git config user.name "gazoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更はありませんでした"
            exit 0
          fi
          git commit -m "自動更新: Gazooの車両情報・売約・画像"
          # 管理画面からの保存と同時になると押し出されるので、取り込んで数回やり直す
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "他の更新が入ったため取り込んで再試行します（${i}回目）"
            git pull --rebase origin main
            sleep 5
          done
          echo "::error::保存できませんでした"
          exit 1
