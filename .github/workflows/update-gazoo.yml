name: Gazoo自動更新

on:
  schedule:
    - cron: "0 21 * * *"   # 日本時間 朝6:00
    - cron: "0 9 * * *"    # 日本時間 夕方18:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gazooをチェックしてデータを更新
        run: node scripts/update-from-gazoo.mjs

      - name: 変更があれば保存
        run: |
          git config user.name "gazoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cars.json
          git diff --cached --quiet || (git commit -m "自動更新: Gazooの価格・売約状況" && git push)
