# Gazooの価格・車両情報・売約状況・メイン画像を自動でチェックする仕組み
# 毎時起動し、管理画面で設定した時刻（既定は 朝6時と夜20時・日本時間）のときだけ更新します。
# GitHubの Actions タブ → 「Gazoo自動更新」 → 「Run workflow」で時刻に関係なく実行できます。
name: Gazoo自動更新

on:
  schedule:
    - cron: "0 * * * *"   # 毎時。実際に動かす時刻は data/settings.json で決める
  workflow_dispatch:       # 手動実行ボタン

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 表示設定のずれと解析処理を確認
        run: |
          node scripts/check-consistency.mjs
          node scripts/test-parser.mjs

      - name: Gazooをチェックしてデータと画像を更新
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/update-from-gazoo.mjs

      - name: 変更があれば保存
        run: |
          git config user.name "gazoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "自動更新: Gazooの車両情報・売約・画像" && git push)
